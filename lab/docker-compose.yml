services:
  configguard:
    build:
      context: ./containerlab
      network: host
    image: configguard-lab:local
    container_name: configguard-lab
    volumes:
      - ../:/workspace
    networks:
      lab:
        ipv4_address: 172.30.0.2
    command: ["tail", "-f", "/dev/null"]

  network-device:
    build:
      context: ./containerlab
      network: host
    image: configguard-lab:local
    container_name: configguard-network-device
    ports:
      - "2222:22"
    volumes:
      - ${CONFIGGUARD_SSH_DIR:-./ssh}:/lab-ssh:ro
    networks:
      lab:
        ipv4_address: 172.30.0.10
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        test -s /lab-ssh/authorized_keys
        mkdir -p /run/sshd /root/.ssh
        cp /lab-ssh/authorized_keys /root/.ssh/authorized_keys
        chmod 700 /root/.ssh
        chmod 600 /root/.ssh/authorized_keys
        /usr/sbin/sshd
        exec tail -f /dev/null

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
